name: womensday
description: Мой женский календарь.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  get_it: ^8.2.0
  go_router: ^16.2.1
  shared_preferences: ^2.5.3
  table_calendar: ^3.2.0
  intl: ^0.20.2
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  pdf: ^3.11.3
  path_provider: ^2.1.5
  share_plus: 13.1.0
  url_launcher: ^6.3.2
  flutter_custom_tabs: ^2.5.0
  app_links: ^7.2.1
  material_symbols_icons: ^4.2960.0
  flutter_rustore_update: ^10.5.2
  flutter_rustore_review: ^10.5.2
  flutter_rustore_pay: ^11.1.0
  appmetrica_plugin: ^4.1.0
  yandex_mobileads: ^8.4.0
  package_info_plus: ^10.2.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: iconWD.png
  remove_alpha_ios: true
  background_color_ios: "#F4C2D0"
  adaptive_icon_background: "#F4C2D0"
  adaptive_icon_foreground: iconWD.png
  adaptive_icon_foreground_inset: 20

flutter:
  uses-material-design: true
  assets:
    - assets/mood/
    - assets/legal/
    - assets/fonts/
    - assets/icons/
    - assets/certs/
